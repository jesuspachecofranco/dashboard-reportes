name: Streamlit Keep Alive

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite probarlo de forma manual cuando quieras

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer ping a la aplicación
        run: |
          curl -L --max-redirs 5 -s -o /dev/null -w "Código de respuesta HTTP: %{http_code}\n" "https://incidencias-2026.streamlit.app/"
