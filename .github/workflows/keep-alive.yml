name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer ping a la aplicación
        run: curl -L --max-redirs 5 -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://incidencias-2026.streamlit.app/
